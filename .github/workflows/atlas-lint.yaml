name: Atlas lint
on:
  pull_request:
    paths:
      - 'migrations/*'
      - 'migrations-seed-dev/*'
jobs:
  lint:
    services:
      # Spin up a mysql:8 container to be used as the dev-database for analysis.
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_DATABASE: dev
          MYSQL_ROOT_PASSWORD: pass
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "mysqladmin ping -ppass"
          --health-interval 10s
          --health-start-period 10s
          --health-timeout 5s
          --health-retries 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 100
      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"
      - name: Install Atlas (Community Edition)
        run: curl -sSf https://atlasgo.sh | sh -s -- --community -y
      - name: Lint migrations
        run: |
          atlas migrate lint \
            --dir 'file://migrations' \
            --dev-url 'mysql://root:pass@localhost:3306/dev' \
            --git-base "origin/${{ github.base_ref }}"
      - name: Check seed-dev has no schema changes
        run: |
          status=0
          for f in migrations-seed-dev/*.sql; do
            awk -v file="$f" '
              BEGIN { RS = ";"; bad = 0 }
              {
                stmt = $0
                gsub(/\/\*([^*]|\*+[^*\/])*\*+\//, "", stmt)
                gsub(/--[^\n]*/, "", stmt)
                gsub(/^[ \t\r\n]+|[ \t\r\n]+$/, "", stmt)
                if (stmt == "") next
                if (toupper(stmt) !~ /^(INSERT|UPDATE|DELETE|REPLACE|SET)[ \t\r\n(]/) {
                  split(stmt, lines, "\n")
                  printf "::error file=%s::Only data statements (INSERT/UPDATE/DELETE/REPLACE/SET) are allowed in seed-dev migrations, found: %s\n", file, lines[1]
                  bad = 1
                }
              }
              END { exit bad }
            ' "$f" || status=1
          done
          exit $status
      - name: Check seed-dev atlas.sum is up to date
        run: |
          atlas migrate hash --dir 'file://migrations-seed-dev'
          git diff --exit-code migrations-seed-dev/atlas.sum \
            || { echo "::error file=migrations-seed-dev/atlas.sum::atlas.sum is outdated, run 'make atlas-seed-dev-hash'"; exit 1; }